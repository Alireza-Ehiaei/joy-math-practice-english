name: Build and Upload iOS IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      MD_APPLE_SDK_ROOT: /Applications/Xcode.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Initialize Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          xcodebuild -showsdks | grep -E "(iphoneos|ios-simulator)" || { echo "iOS SDK missing"; exit 1; }
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
          cache: true
          cache-key: flutter-3.29.3
          cache-path: /Users/runner/hostedtoolcache/flutter

      - name: Clean Flutter project
        run: |
          flutter clean > flutter_clean_log.txt 2>&1 || { cat flutter_clean_log.txt; exit 1; }
          rm -rf ios/Flutter ios/Pods ios/Podfile.lock ~/Library/Developer/Xcode/DerivedData/*
          flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Update iOS deployment target
        run: |
          DEPLOYMENT_TARGET="16.0"
          echo "Updating Podfile platform to $DEPLOYMENT_TARGET"
          sed -i '' "s/platform :ios, '.*'/platform :ios, '$DEPLOYMENT_TARGET'/" ios/Podfile
          echo "Ensuring IPHONEOS_DEPLOYMENT_TARGET in Podfile"
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET.*=.*'$DEPLOYMENT_TARGET'" ios/Podfile; then
            echo "Adding or updating IPHONEOS_DEPLOYMENT_TARGET in post_install block"
            if grep -q "post_install do |installer|" ios/Podfile; then
              sed -i '' "/flutter_additional_ios_build_settings(target)/a\\
                \ \ \ \ target.build_configurations.each do |config|\\
                \ \ \ \ \ \ config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '$DEPLOYMENT_TARGET'\\
                \ \ \ \ end" ios/Podfile
            else
              echo -e "\npost_install do |installer|\n  installer.pods_project.targets.each do |target|\n    flutter_additional_ios_build_settings(target)\n    target.build_configurations.each do |config|\n      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '$DEPLOYMENT_TARGET'\n      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''\n      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n    end\n  end\nend" >> ios/Podfile
            fi
          fi
          echo "Podfile content after update:"
          cat ios/Podfile
          grep -n "platform :ios" ios/Podfile
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..

      - name: Debug project state
        run: |
          echo "Checking ios/Runner.xcodeproj/project.pbxproj:"
          cat ios/Runner.xcodeproj/project.pbxproj | grep -E "Release.xcconfig|Generated.xcconfig"
          echo "Checking ios/Podfile:"
          if [ -f "ios/Podfile" ]; then cat ios/Podfile; else echo "Podfile missing"; fi
          echo "Checking pubspec.yaml dependencies:"
          grep -E "in_app_purchase" pubspec.yaml || echo "No in_app_purchase dependency found"

      - name: Generate Flutter iOS configs
        run: |
          cd ios
          pod deintegrate > pod_deintegrate_log.txt 2>&1 || { cat pod_deintegrate_log.txt; exit 1; }
          rm -rf Pods Podfile.lock
          cd ..
          flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }
          flutter clean > flutter_clean_log.txt 2>&1 || { cat flutter_clean_log.txt; exit 1; }
          rm -rf ios/Flutter ~/Library/Developer/Xcode/DerivedData/*
          flutter create --platforms=ios . > flutter_create_log.txt 2>&1 || { cat flutter_create_log.txt; exit 1; }
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release > xcode_clean_log.txt 2>&1 || { cat xcode_clean_log.txt; exit 1; }
          cd ..
          flutter build ios --release --no-codesign > flutter_config_log.txt 2>&1 || { cat flutter_config_log.txt; exit 1; }
          ls -l ios/Flutter/ || { echo "ios/Flutter directory missing"; exit 1; }
          if [ -f "ios/Flutter/Release.xcconfig" ]; then
            echo "✓ Release.xcconfig generated"
          else
            echo "✗ Failed to generate Release.xcconfig"
            exit 1
          fi
          if [ -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks-Release-input-files.xcfilelist" ] && [ -f "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks-Release-output-files.xcfilelist" ]; then
            echo "✓ Pods file lists generated"
          else
            echo "✗ Pods file lists missing"
            exit 1
          fi

      - name: Ensure Runner.entitlements exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/Runner.entitlements << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOL
          ls -l ios/Runner/Runner.entitlements
          echo "Runner.entitlements content:"
          cat ios/Runner/Runner.entitlements

      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <true/>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>teamID</key>
              <string>AHVM2Z8TDL</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tech4dev.mathjoypracticeenglish</key>
                  <string>MathJoyAppStore2025</string>
              </dict>
          </dict>
          </plist>
          EOL
          cat ios/ExportOptions.plist

      - name: Update Xcode project for entitlements and signing
        run: |
          gem install xcodeproj
          cat > update_project.rb << EOL
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          unless target
            puts "Error: Runner target not found"
            exit 1
          end
          
          # Add entitlements file reference if needed
          entitlements_path = 'Runner/Runner.entitlements'
          file_ref = project.files.find { |f| f.path == entitlements_path } 
          unless file_ref
            file_ref = project.main_group['Runner'].new_file(entitlements_path)
          end
          target.add_file_references([file_ref])
          
          # Configure Runner target
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = entitlements_path
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = 'AHVM2Z8TDL'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'MathJoyAppStore2025'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.tech4dev.mathjoypracticeenglish'
          end
          
          # Configure ALL Pods targets to use Automatic signing
          project.targets.each do |t|
            next if t.name == 'Runner' || t.name.include?('Pods-')
            
            t.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              config.build_settings.delete('CODE_SIGN_IDENTITY')
              config.build_settings.delete('DEVELOPMENT_TEAM')
              config.build_settings.delete('CODE_SIGN_ENTITLEMENTS')
            end
          end
          
          # Also configure Pods project targets
          pods_project_path = 'ios/Pods/Pods.xcodeproj'
          if File.exist?(pods_project_path)
            pods_project = Xcodeproj::Project.open(pods_project_path)
            pods_project.targets.each do |t|
              t.build_configurations.each do |config|
                config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
                config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
                config.build_settings.delete('CODE_SIGN_IDENTITY')
                config.build_settings.delete('DEVELOPMENT_TEAM')
              end
            end
            pods_project.save
          end
          
          project.save
          puts "Updated project settings"
          EOL
          ruby update_project.rb

      - name: Verify project settings
        run: |
          if [ -f "ios/Runner/Runner.entitlements" ]; then
            echo "✓ Runner.entitlements exists"
          else
            echo "✗ Runner.entitlements missing"
            exit 1
          fi
          if grep -q "Runner/Runner.entitlements" ios/Runner.xcodeproj/project.pbxproj; then
            echo "✓ Entitlements referenced in Xcode project"
          else
            echo "✗ Entitlements not referenced"
            exit 1
          fi
          if [ -f "ios/Flutter/Release.xcconfig" ]; then
            echo "✓ Release.xcconfig exists"
          else
            echo "✗ Release.xcconfig missing"
            exit 1
          fi

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

      - name: Import Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "Error: certificate.p12 is empty or invalid"
            exit 1
          fi
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep "AHVM2Z8TDL" || { echo "Certificate import failed"; exit 1; }

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/7e2e5608-7c77-45ff-ac95-b86f868dff8c.mobileprovision
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="MathJoyAppStore2025"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          cd ios
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release > xcode_clean_log.txt 2>&1 || { cat xcode_clean_log.txt; exit 1; }
          cd ..
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --verbose > build_log.txt 2>&1 || { cat build_log.txt | grep -i "error:"; exit 1; }
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/math_joy_practice_english.ipa
        env:
          DEVELOPMENT_TEAM: AHVM2Z8TDL
          PROFILE_NAME: MathJoyAppStore2025

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << EOL
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/math_joy_practice_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false
              )
            end
          end
          EOL

      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: fastlane ios upload_to_app_store_connect > fastlane_log.txt 2>&1 || { cat fastlane_log.txt | grep -i "error:"; exit 1; }

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            flutter_clean_log.txt
            pub_get_log.txt
            pod_install_log.txt
            flutter_config_log.txt
            build_log.txt
            fastlane_log.txt
            fastlane/report.xml
            app-ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
